name: Deploy main1 to EC2

on:
  push:
    branches:
      - main1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with deploy-aws.yml so main and main1 can never promote concurrently.
  group: production-aws
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: casino_test
          POSTGRES_USER: casino_test
          POSTGRES_PASSWORD: casino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casino_test -d casino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://casino_test:casino_test@127.0.0.1:5432/casino_test
      TEST_DATABASE_URL: postgresql+psycopg://casino_test:casino_test@127.0.0.1:5432/casino_test
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out pushed main1 commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main1' || github.sha }}

      - name: Verify deployment commit
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main1
          if [[ "${{ github.event_name }}" == "push" ]]; then
            test "$sha" = "${{ github.sha }}"
          fi
          test "$sha" = "$(git rev-parse origin/main1)"
          echo "Deploying commit $sha from main1"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt

      - name: Test FastAPI backend
        working-directory: Backend
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          alembic upgrade head
          pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-website/package-lock.json

      - name: Install and build umbrella frontend
        working-directory: frontend-website
        env:
          VITE_API_URL: /api
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run test:permissions
          npm run build
          test -s dist/index.html
          test -d dist/assets
          echo "Frontend build completed for ${{ steps.version.outputs.sha }}"

      - name: Package deployment payload
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -Eeuo pipefail
          payload="$RUNNER_TEMP/main1-payload"
          mkdir -p "$payload"
          tar -C frontend-website/dist -czf "$payload/frontend-$DEPLOY_SHA.tar.gz" .
          cp deploy/aws/deploy-main1-remote.sh "$payload/"
          bash -n "$payload/deploy-main1-remote.sh"
          echo "$DEPLOY_SHA" > "$payload/commit-sha"

      - name: Upload tested deployment payload
        uses: actions/upload-artifact@v4
        with:
          name: main1-deployment-${{ steps.version.outputs.sha }}
          path: ${{ runner.temp }}/main1-payload
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: test-build
    runs-on: [self-hosted, linux, x64, casino-production]
    environment: production
    timeout-minutes: 25
    steps:
      - name: Download tested payload
        uses: actions/download-artifact@v4
        with:
          name: main1-deployment-${{ needs.test-build.outputs.sha }}
          path: ${{ runner.temp }}/main1-payload

      - name: Stage tested frontend and deployment script
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.test-build.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test "$(id -un)" = "ec2-user"
          remote_dir="/home/ec2-user/deploy-staging/incoming-$DEPLOY_SHA"
          install -d -m 0700 "$remote_dir"
          install -m 0600 "$RUNNER_TEMP/main1-payload/frontend-$DEPLOY_SHA.tar.gz" "$remote_dir/"
          install -m 0700 "$RUNNER_TEMP/main1-payload/deploy-main1-remote.sh" "$remote_dir/"

      - name: Deploy main1 release on EC2
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.test-build.outputs.sha }}
        run: |
          set -Eeuo pipefail
          remote_dir="/home/ec2-user/deploy-staging/incoming-$DEPLOY_SHA"
          echo "Starting EC2 deployment for commit $DEPLOY_SHA"
          bash "$remote_dir/deploy-main1-remote.sh" \
            "$DEPLOY_SHA" "$remote_dir/frontend-$DEPLOY_SHA.tar.gz"

      - name: Verify deployed routes
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://bidtobuild.dev"
          resolve="bidtobuild.dev:443:127.0.0.1"
          verified=0
          for _ in {1..12}; do
            if [[ $(curl --noproxy '*' --resolve "$resolve" --max-time 15 --silent --show-error "$base/api/health" || true) == '{"status":"ok"}' ]] \
              && curl --noproxy '*' --resolve "$resolve" --max-time 15 --fail --silent --show-error "$base/" | grep -qi '<div id="root"></div>' \
              && curl --noproxy '*' --resolve "$resolve" --max-time 15 --fail --silent --show-error "$base/admin/" | grep -qi '<div id="root"></div>' \
              && curl --noproxy '*' --resolve "$resolve" --max-time 15 --fail --silent --show-error "$base/participant/" | grep -qi '<div id="root"></div>' \
              && curl --noproxy '*' --resolve "$resolve" --max-time 15 --fail --silent --show-error "$base/leaderboard/problem" | grep -qi '<div id="root"></div>'; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" -eq 1
          echo "Deployment ${{ needs.test-build.outputs.sha }} is healthy and publicly reachable"
