name: Deploy main to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or tag to deploy (use a previous main SHA to roll back)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-aws
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Record exact deployment SHA
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "Ref is not contained in origin/main; refusing production deployment." >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "push" && "$sha" != "${{ github.sha }}" ]]; then
            echo "Checkout SHA does not match the pushed main SHA." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt

      - name: Test backend
        shell: bash
        working-directory: Backend
        env:
          DEPLOYED_COMMIT: ${{ steps.version.outputs.sha }}
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-website/package-lock.json

      - name: Build umbrella frontend
        working-directory: frontend-website
        env:
          VITE_API_URL: /api
        run: |
          npm ci --no-audit --no-fund
          npm run test:permissions
          npm run build

      - name: Verify production bundles contain no seeded credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -R -E -i \
            'DemoAdmin|DemoLeader|DemoMember|@demo\.example|admin\.demo@|Use Admin Demo|Use Leader Demo|Use Participant Demo' \
            frontend-website/dist; then
            echo 'Production bundle contains a seeded credential or demo-login helper.' >&2
            exit 1
          fi

      - name: Package tested release
        id: package
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/casino-release"
          archive="$RUNNER_TEMP/casino-hackathon-$DEPLOY_SHA.tar.gz"
          mkdir -p "$stage/Backend" "$stage/static" "$stage/deploy/aws"
          cp -a Backend/app Backend/scripts Backend/requirements.txt Backend/run.py "$stage/Backend/"
          cp -a frontend-website/dist/. "$stage/static/"
          cp -a deploy/aws/deploy-release.sh deploy/aws/nginx.conf deploy/aws/casino-hackathon-backend.service "$stage/deploy/aws/"
          printf 'DEPLOYED_COMMIT=%s\n' "$DEPLOY_SHA" > "$stage/deploy.env"
          tar -C "$stage" -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload tested release
        uses: actions/upload-artifact@v4
        with:
          name: casino-release-${{ steps.version.outputs.sha }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: test-build
    runs-on: [self-hosted, linux, x64, casino-production]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Download tested release
        uses: actions/download-artifact@v4
        with:
          name: casino-release-${{ needs.test-build.outputs.sha }}
          path: ${{ runner.temp }}/casino-release

      - name: Deploy immutable release
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.test-build.outputs.sha }}
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/casino-release/casino-hackathon-$DEPLOY_SHA.tar.gz"
          stage="$(mktemp -d "$RUNNER_TEMP/casino-deploy.XXXXXX")"
          trap 'find "$stage" -mindepth 1 -delete; rmdir "$stage"' EXIT
          test -f "$archive"
          tar -xzf "$archive" -C "$stage" ./deploy/aws/deploy-release.sh
          bash "$stage/deploy/aws/deploy-release.sh" "$archive" "$DEPLOY_SHA"

  verify-public:
    needs: [test-build, deploy]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify public deployment
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_SHA: ${{ needs.test-build.outputs.sha }}
        run: |
          set -Eeuo pipefail
          base="http://$EC2_HOST"
          curl --fail --silent --show-error "$base/" | grep -qi '<div id="root"></div>'
          curl --fail --silent --show-error "$base/participant/" | grep -qi '<div id="root"></div>'
          curl --fail --silent --show-error "$base/admin/" | grep -qi '<div id="root"></div>'
          test "$(curl --fail --silent --show-error "$base/api/health")" = '{"status":"ok"}'
          test "$(curl --fail --silent --show-error "$base/api/version")" = "{\"commit\":\"$DEPLOY_SHA\"}"
