<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Auction WebSocket Test</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; padding: 20px; }
        h1 { color: #4CAF50; }
        #messages { background-color: #333; padding: 15px; border-radius: 8px; height: 300px; overflow-y: scroll; font-family: monospace; }
        .msg { margin-bottom: 10px; padding: 8px; border-radius: 5px; background: #444; border-left: 5px solid #4CAF50; }
        .status { padding: 10px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; }
        .connected { background-color: rgba(76, 175, 80, 0.2); border: 1px solid #4CAF50; color: #4CAF50; }
        .disconnected { background-color: rgba(244, 67, 54, 0.2); border: 1px solid #f44336; color: #f44336; }
    </style>
</head>
<body>

    <h1>📡 Live Auction WebSocket Test</h1>
    
    <div id="status" class="status disconnected">🔴 Disconnected... Waiting to connect</div>

    <h3>Live Updates (Bids & Rounds)</h3>
    <div id="messages">
        <!-- Live messages will appear here -->
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        
        // Connect to our FastAPI WebSocket
        const ws = new WebSocket("ws://127.0.0.1:8000/ws/auction");

        ws.onopen = function() {
            statusDiv.textContent = "🟢 Connected to Auction Server!";
            statusDiv.className = "status connected";
        };

        ws.onmessage = function(event) {
            // This runs whenever backend broadcasts a message
            const data = JSON.parse(event.data);
            
            const msgEl = document.createElement("div");
            msgEl.className = "msg";
            
            // Format the message based on its type
            if (data.type === "new_bid") {
                msgEl.innerHTML = `💸 <b>${data.team_name}</b> placed a bid of <b>${data.amount} coins</b> on PS-${data.ps_number}`;
            } else if (data.type === "round_started") {
                msgEl.innerHTML = `⏱️ <b>Round ${data.round} Started!</b> Duration: ${data.duration} mins`;
            } else if (data.type === "round_ended") {
                msgEl.innerHTML = `🛑 <b>Round Ended!</b> <br> Winners: ${JSON.stringify(data.results)}`;
            } else {
                msgEl.textContent = event.data;
            }
            
            messagesDiv.prepend(msgEl);
        };

        ws.onclose = function() {
            statusDiv.textContent = "🔴 Disconnected from server.";
            statusDiv.className = "status disconnected";
        };
    </script>
</body>
</html>
