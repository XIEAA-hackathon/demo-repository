server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/casino_hackathon/current/static/public;
    index index.html;
    client_max_body_size 12m;

    location = /api { return 308 /api/; }
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /participant { return 308 /participant/; }
    location /participant/ {
        root /opt/casino_hackathon/current/static;
        try_files $uri $uri/ /participant/index.html;
    }

    location = /admin { return 308 /admin/; }
    location /admin/ {
        root /opt/casino_hackathon/current/static;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
